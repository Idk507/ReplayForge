[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "replayforge"
version = "0.1.0"
description = "Evidence-backed incident reproduction and repair"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic==1.17.0",
    "contree-sdk>=0.3.6",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langgraph==1.2.15",
    "langsmith==0.14.8",
    "psycopg[binary]==3.2.10",
    "pydantic==2.12.3",
    "sqlalchemy==2.0.44",
    "starlette==1.3.1",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[tool.hatch.build.targets.wheel]
packages = ["packages", "services", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages", "services", "scripts"]
