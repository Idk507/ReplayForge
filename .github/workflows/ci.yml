# Quality gates from AGENTS.md. Read-only token, no secrets, no deployment, no
# provider or GitHub-write calls. Third-party actions are pinned to commit SHAs
# (tag shown in the comment). The Postgres service is an ephemeral throwaway.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Fetch the pinned pytest wheelhouse (hash-verified)
        run: uv run python -m scripts.fetch_pytest_wheelhouse --run
      - name: Unit and contract tests
        run: uv run pytest tests/unit tests/contract -q
      - name: Secret scan
        run: uv run python -m scripts.check_secrets
      - name: Python dependency audit
        run: uv run --with pip-audit==2.10.1 pip-audit

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-throwaway-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run python -m scripts.fetch_pytest_wheelhouse --run
      - name: Backend suite on a disposable database and roles
        env:
          REPLAYFORGE_TEST_ADMIN_PASSWORD: ci-throwaway-database-password
        run: >-
          uv run python -m scripts.test_postgres
          --evidence-name ci-backend.xml --timeout-seconds 1800
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-junit
          path: docs/evidence/ci-backend.xml
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (synthetic API; the real-API case needs the disposable DB)
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-junit
          path: apps/web/test-results/results.xml
          if-no-files-found: warn
