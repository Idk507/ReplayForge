[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replayforge-checkout-fixture"
version = "0.1.0"
description = "Tiny synthetic payment retry bug fixture for ReplayForge"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["checkout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
